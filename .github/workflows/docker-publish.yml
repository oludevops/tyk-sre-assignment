# =============================================================================
# GitHub Actions Workflow — Build and push Docker image to ghcr.io
# =============================================================================
# This workflow runs automatically on every push to the main branch.
# It builds the Docker image from golang/Dockerfile and pushes it to the
# GitHub Container Registry (ghcr.io) with two tags:
#
#   ghcr.io/oludevops/sre-tool:latest      — always points to the most recent build
#   ghcr.io/oludevops/sre-tool:<git-sha>   — immutable tag tied to the exact commit
#
# The git SHA tag is what you pass to helm install --set image.tag=<sha>
# so you know exactly which commit is running in the cluster.
#
# Authentication uses the automatic GITHUB_TOKEN secret — no manual setup needed.
# =============================================================================

name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      # Only trigger when Go source or the Dockerfile changes.
      # Pushes that only update docs or helm charts skip the image build.
      - "golang/**"

jobs:
  build-and-push:
    name: Build and push to ghcr.io
    runs-on: ubuntu-latest

    # Grant the workflow permission to write packages (push images) and
    # read repository contents (checkout the code).
    permissions:
      contents: read
      packages: write

    steps:
      # Step 1 — Check out the repository code onto the runner.
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Log in to the GitHub Container Registry.
      # GITHUB_TOKEN is automatically provided by GitHub Actions — no secrets
      # need to be configured manually. The token is scoped to this repository.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 3 — Extract metadata (tags and labels) for the image.
      # The docker/metadata-action generates:
      #   - ghcr.io/oludevops/sre-tool:latest  (on every push to main)
      #   - ghcr.io/oludevops/sre-tool:<sha>   (short git commit SHA)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/oludevops/sre-tool
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Step 4 — Build the image and push it to ghcr.io.
      # The Dockerfile lives inside the golang/ directory.
      # context: golang/  means the build context is the golang/ folder —
      # all COPY instructions in the Dockerfile are relative to this folder.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: golang/
          file: golang/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
