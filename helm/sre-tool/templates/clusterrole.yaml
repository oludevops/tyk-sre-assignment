# ClusterRole — defines what the tool is allowed to do in the cluster.
#
# A ClusterRole applies across all namespaces, which is what we need because
# the tool lists Deployments in every namespace (not just one).
#
# We follow the principle of least privilege — the tool only gets the exact
# permissions it needs and nothing more:
#
#   namespaces  : list  — needed to iterate all namespaces when checking deployments
#   deployments : list  — needed to read Deployment specs and status across namespaces
#
# The /healthz endpoint calls Discovery().ServerVersion() which hits /version
# on the API server. That endpoint is publicly accessible to any authenticated
# principal and requires no explicit RBAC permission.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Chart.Name }}-role
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
  - apiGroups: [""]               # "" means the core API group (namespaces, pods, etc.)
    resources: ["namespaces"]
    verbs: ["list"]

  - apiGroups: ["apps"]           # "apps" group contains Deployments, StatefulSets, etc.
    resources: ["deployments"]
    verbs: ["list"]
