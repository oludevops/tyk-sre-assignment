# ServiceAccount — the identity the pod runs as inside the cluster.
#
# When a pod runs in Kubernetes it is automatically given a token for its
# ServiceAccount. The tool uses this token (mounted at a well-known path)
# to authenticate against the Kubernetes API server — no kubeconfig needed.
#
# Without a dedicated ServiceAccount the pod would use the "default" account
# which typically has no permissions, causing all API calls to fail with 403.
apiVersion: v1
kind: ServiceAccount
metadata:
  # {{ .Values.serviceAccount.name }} is a Helm template expression.
  # Helm replaces it with the value from values.yaml at install time.
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    # Standard Helm labels — used by helm list and helm status to track resources.
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
